aid: ellipsis-drive
name: Ellipsis Drive
description: >-
  Ellipsis Drive is a cloud-native spatial data management platform that lets teams upload,
  store, process, share, and serve raster, vector, and 3D point-cloud geospatial data through a
  single interoperable interface. Uploaded files are automatically processed into high-performance
  Tile Pyramid Archives (rasters) and Paged Vector Tiles (vectors) and served through standard OGC
  protocols (WMS, WMTS, WFS, WCS, XYZ, and vector tiles) alongside a REST API v3 with Bearer-token
  and OAuth2 authorization. Official SDKs and integrations cover Python, R, and JavaScript, plus
  plugins for QGIS, ArcGIS (JS, Pro, and Server), Mapbox GL, Leaflet, React-Leaflet, and Power BI.
  The platform offers storage-based pricing, license-free data sharing and consumption,
  subscriptions for selling spatial data, and both instant SaaS and private self-hosted deployments.
